[profile.default]
auto_detect_remappings = false
libs = ["lib"]
src = "contracts"
test = "tests"
out = "artifacts"
cache_path = "cache"
bytecode_hash = "none"
cbor_metadata = false
verbosity = 3
# Narrow fs grants: artifacts + config are read-only; the deploy script may only touch the four per-chain deployment
# records (final + pending). The run logs (deployments/logs/) are written by script/fork-dry-run.sh, not by forge.
fs_permissions = [
    { access = "read", path = "./artifacts" },
    { access = "read", path = "./config" },
    { access = "read-write", path = "./deployments/ethereum.json" },
    { access = "read-write", path = "./deployments/ethereum.pending.json" },
    { access = "read-write", path = "./deployments/base.json" },
    { access = "read-write", path = "./deployments/base.pending.json" },
    { access = "read-write", path = "./deployments/arbitrum.json" },
    { access = "read-write", path = "./deployments/arbitrum.pending.json" },
    { access = "read-write", path = "./deployments/robinhood.json" },
    { access = "read-write", path = "./deployments/robinhood.pending.json" },
    { access = "read-write", path = "./deployments/hyperliquid.json" },
    { access = "read-write", path = "./deployments/hyperliquid.pending.json" },
]
optimizer = true
optimizer_runs = 200

# Ignore compiler warnings that should be intentionally-skipped
ignored_warnings_from = [
    "contracts/release/extensions/integration-manager/integrations/utils/0.8.19/bases/GenericWrappingAdapterBase.sol",
    "contracts/templates/"
]

# NOTE: Specifying shanghai as the evm_version seems required for the Goerli tests to pass
evm_version = "cancun"

[profile.default.optimizer_details]
yul = false

[profile.dev]
optimizer=false

[rpc_endpoints]
mainnet = "${ETHEREUM_NODE_MAINNET}"
polygon = "${ETHEREUM_NODE_POLYGON}"
arbitrum = "${ETHEREUM_NODE_ARBITRUM}"
base = "${ETHEREUM_NODE_BASE}"
robinhood = "${ETHEREUM_NODE_ROBINHOOD}"
hyperliquid = "${ETHEREUM_NODE_HYPERLIQUID}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY_MAINNET}", chain = "mainnet" }
polygon = { key = "${ETHERSCAN_API_KEY_POLYGON}", chain = "polygon" }

[lint]
# Several lints fail on acronyms like "ERC" instead of "Erc", so we exclude those.
# Some other lints are helpful but there are many violations in the codebase already. We could inline-exclude those.
exclude_lints = [
    "pascal-case-struct",
    "mixed-case-function",
    "mixed-case-variable",
    "unaliased-plain-import",
    "asm-keccak256",
    "unwrapped-modifier-logic",
    "unsafe-typecast"
]
ignore = [
    "contracts/external-interfaces/**/*.sol",
    "tests/**/*.sol"
]
